name: Vite Auto Build

# main 브랜치에 push 이벤트가 발생할 때 실행
"on":
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # 3. 의존성 패키지 설치
      - name: Install dependencies
        run: npm ci

      # 4. Vite 프로젝트 빌드 (dist 폴더 생성)
      - name: Build project
        run: npm run build

      # 5. 빌드 결과(dist)를 레포지토리에 커밋 & push
      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist -f
          git diff --staged --quiet || git commit -m "chore: build dist [skip ci]"
          git push
